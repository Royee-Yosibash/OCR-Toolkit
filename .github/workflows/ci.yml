name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check

  formatting-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  version-bump-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version was bumped
        run: |
          PR_VERSION=$(python3 -c "import json; print(json.load(open('release_data.json'))['version'])")
          MAIN_VERSION=$(git show origin/main:release_data.json | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          echo "PR version: $PR_VERSION"
          echo "Main version: $MAIN_VERSION"
          python3 -c "
          from packaging.version import Version
          pr, main = Version('$PR_VERSION'), Version('$MAIN_VERSION')
          if pr <= main:
              raise SystemExit(f'Version must be bumped. PR={pr} <= main={main}')
          print(f'Version bump OK: {main} -> {pr}')
          "

  unit-tests-and-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[full]"

      - name: Run tests
        run: python -m tests.tests_runner

      - name: Run evaluation pipeline
        run: python -m scripts.run_evaluation
